# Il lag di #474 non può tornare (#486): tetti di tempo e di memoria sulle funzioni pesanti del main e sull'app Electron vera
# (senza finestra visibile, sotto xvfb). Rossa se un tetto è superato. L'intera prova sta sotto i 5 minuti (timeout del job).
name: prestazioni
on:
  pull_request:
    paths: ['sessioni/**', '.github/workflows/prestazioni.yml']
  push:
    branches: [dev, main]
    paths: ['sessioni/**', '.github/workflows/prestazioni.yml']

concurrency:
  group: prestazioni-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prestazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sessioni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sessioni/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('sessioni/package-lock.json') }}
      - name: Librerie di Electron e xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6
        working-directory: .
      - run: npm ci --no-audit --no-fund && node node_modules/electron/install.js
      - run: npm run build
      - name: Funzioni pesanti del main (tempo e memoria)
        run: node --expose-gc --test dist/test/budget/funzioni.perf.js
      - name: App Electron senza finestra visibile (prima riga, blocchi, processore a riposo)
        run: xvfb-run -a node scripts/budget-avvio.cjs
