<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Sandbox Linux senza SF Pro: Chromium ricade su DejaVu Sans (più largo di SF Pro: i testi vanno a capo in punti diversi dal disegno).
     Inter ha le misure più vicine. Uso (vedi test/beta/LEGGIMI.md, «Font nella sandbox»):
     FONTCONFIG_FILE=$PWD/scripts/fontconfig-sf-pro.conf node scripts/parita-tutti.mjs … -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.cache/clotch-font</dir>
  <match target="pattern"><test name="family"><string>SF Pro</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit></match>
</fontconfig>
